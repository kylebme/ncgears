[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ncgear"
version = "0.2.0"
description = "Generate noncircular gears with a Python and Shapely geometry engine"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "ncgear contributors" }]
keywords = ["gear", "noncircular-gear", "cad", "mechanism", "shapely"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "shapely>=2.1",
  "sympy>=1.12",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8"]
build = ["build>=1.2"]
dev = [
  "build>=1.2",
  "matplotlib>=3.8",
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
ncgear = "ncgear.cli:main"

[project.urls]
Homepage = "https://github.com/kylebme/geargen5-5"
Issues = "https://github.com/kylebme/geargen5-5/issues"
Source = "https://github.com/kylebme/geargen5-5"

[tool.setuptools.packages.find]
include = ["ncgear*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
