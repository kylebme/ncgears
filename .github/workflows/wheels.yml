name: Build and test

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest

  package:
    name: Build pure-Python package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: python -m pip install build && python -m build
      - name: Verify wheel contents and runtime
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import ncgears; pair = ncgears.generate('2*phi', teeth=12, samples=1024, samples_per_radian=20, output_directory='/tmp/ncgears-smoke'); assert (pair.drive_teeth, pair.driven_teeth) == (12, 6)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
