name: Build and test

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest

  package:
    name: Build pure-Python package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          module_version="$(python -c 'import re; print(re.search(r"^__version__ = \"([^\"]+)\"", open("ncgears/__init__.py").read(), re.MULTILINE).group(1))')"
          test "${package_version}" = "${module_version}"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Build distributions
        run: python -m pip install build && python -m build
      - name: Verify wheel contents and runtime
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import ncgears; pair = ncgears.generate('2*phi', teeth=12, samples=1024, samples_per_radian=20, output_directory='/tmp/ncgears-smoke'); assert (pair.drive_teeth, pair.driven_teeth) == (12, 6)"
      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/ncgears
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
