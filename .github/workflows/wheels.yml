name: Build and test

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: Source tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libcgal-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run Python tests
        run: python -m pytest
      - name: Build and test the C++ engine
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release &&
          cmake --build build --parallel 2 &&
          ctest --test-dir build --output-on-failure

  wheels:
    name: Wheel / ${{ matrix.os }}
    needs: source-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-15-intel
          - macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: pypa/cibuildwheel@v3.4.1
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
